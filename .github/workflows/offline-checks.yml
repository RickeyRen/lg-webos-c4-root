name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_shell: sh
          - os: windows-latest
            test_shell: 'C:/Program Files/Git/usr/bin/bash.exe'
    runs-on: ${{ matrix.os }}
    env:
      LG_ROOT_TEST_SHELL: ${{ matrix.test_shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tools tests
      - run: python tools/root_flow.py --help
      - run: python tools/root_flow.py --tv 192.0.2.10 --local-ip 192.0.2.20 --dry-run
